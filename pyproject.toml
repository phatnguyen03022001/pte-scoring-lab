[project]
name = "pte-scoring-lab"
version = "0.1.0"
description = "Local, uncalibrated PTE-style speech-scoring experiment"
requires-python = ">=3.14,<3.15"
dependencies = [
    "faster-whisper>=1.2,<2",
    "jiwer>=4,<5",
    "av>=18.1,<19",  # faster-whisper 1.2.1 requires av.open(metadata_errors=...); PyAV 19 removed it
]

[tool.uv]
package = false
required-version = ">=0.13.7,<0.14"
